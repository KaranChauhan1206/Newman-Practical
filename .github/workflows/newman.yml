name: Newman Collection Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Start mock server
        run: python3 mock_schedule_agent_server.py &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8765/mcp && echo "Server ready" && break
            sleep 1
          done

      - name: Install Newman
        run: npm install -g newman

      - name: Run collection
        run: |
          newman run Newman.postman_collection.json \
            --environment Newman_Practical.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export newman-report/ci-run.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report/
