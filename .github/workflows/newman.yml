name: Newman Collection Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Start mock server
        run: nohup python3 mock_schedule_agent_server.py > /tmp/server.log 2>&1 &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for mock server..."
          for i in $(seq 1 15); do
            if curl -s http://localhost:8765/mcp > /dev/null 2>&1; then
              echo "Server is ready after $i attempt(s)"
              exit 0
            fi
            echo "  attempt $i/15 – not ready yet, sleeping 1s"
            sleep 1
          done
          echo "ERROR: server did not start. Logs:"
          cat /tmp/server.log
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run collection
        run: |
          newman run Newman.postman_collection.json \
            --environment Newman_Practical.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export newman-report/ci-run.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report/
